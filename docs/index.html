<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kootenay Flight Risk</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c2321;--mute:#6b746f;--line:#e3e1d9;
--low:#2f7d4f;--watch:#b7791f;--high:#c2410c;--severe:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--card:#1d2321;--ink:#eef1ee;--mute:#98a39d;--line:#2e3633;
--low:#5ec48a;--watch:#e0a73c;--high:#f07a45;--severe:#f26b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:720px;margin:auto}
h1{font-size:1.3rem;margin:4px 0}h2{font-size:1rem;margin:22px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--mute);font-size:.85rem}.banner{background:#fde68a;color:#422;padding:8px 12px;border-radius:8px;margin:10px 0;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;border-left-width:6px}
.card.LOW{border-left-color:var(--low)}.card.WATCH{border-left-color:var(--watch)}.card.HIGH{border-left-color:var(--high)}.card.SEVERE{border-left-color:var(--severe)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.big{font-size:1.5rem;font-weight:700}
.LOW .big{color:var(--low)}.WATCH .big{color:var(--watch)}.HIGH .big{color:var(--high)}.SEVERE .big{color:var(--severe)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mute);margin-right:4px;display:inline-block;margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:currentColor}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.foot{color:var(--mute);font-size:.8rem;margin:24px 0}
</style></head><body>
<h1>Kootenay flight risk</h1>
<div class="sub" id="meta">Loading…</div>
<div id="demo"></div>
<div id="app"></div>
<h2>What past cancellations looked like</h2>
<div id="hist" class="sub">Builds up once flight history is loaded.</div>
<p class="foot">Estimate from weather forecasts and past cancellations. Not an airline notice — always confirm with the airline.</p>
<script id="seed" type="application/json">{"generated": "2026-11-10T16:11+00:00", "demo": true, "model": "starting-weights", "model_info": null, "flights": [{"airport": "YZZ", "airport_name": "Trail Regional", "airline": "Pacific Coastal", "flight": "8P452", "date": "2026-11-10", "dep_local": "10:55", "status": "Scheduled", "risk": 0.027, "level": "LOW", "reasons": [], "schedule_source": "static", "flags": []}, {"airport": "YZZ", "airport_name": "Trail Regional", "airline": "Pacific Coastal", "flight": "8P458", "date": "2026-11-10", "dep_local": "17:05", "status": "Scheduled", "risk": 0.027, "level": "LOW", "reasons": [], "schedule_source": "static", "flags": []}, {"airport": "YZZ", "airport_name": "Trail Regional", "airline": "Pacific Coastal", "flight": "8P452", "date": "2026-11-11", "dep_local": "10:55", "status": "Scheduled", "risk": 0.168, "level": "WATCH", "reasons": ["Reduced visibility (under 4.8 km)", "Heavy low cloud", "Gusts over 35 km/h"], "schedule_source": "static", "flags": ["vis_lt_4_8", "lowcloud_90", "gust_35"]}, {"airport": "YZZ", "airport_name": "Trail Regional", "airline": "Pacific Coastal", "flight": "8P458", "date": "2026-11-11", "dep_local": "17:05", "status": "Scheduled", "risk": 0.027, "level": "LOW", "reasons": [], "schedule_source": "static", "flags": []}, {"airport": "YCG", "airport_name": "Castlegar (West Kootenay Regional)", "airline": "Air Canada Express (Jazz)", "flight": "AC8465", "date": "2026-11-10", "dep_local": "11:05", "status": "Scheduled", "risk": 0.027, "level": "LOW", "reasons": [], "schedule_source": "static", "flags": []}, {"airport": "YCG", "airport_name": "Castlegar (West Kootenay Regional)", "airline": "Air Canada Express (Jazz)", "flight": "AC8465", "date": "2026-11-11", "dep_local": "11:05", "status": "Scheduled", "risk": 0.818, "level": "SEVERE", "reasons": ["Visibility under 1.6 km", "Fog", "Reduced visibility (under 4.8 km)", "Heavy low cloud", "Snow falling"], "schedule_source": "static", "flags": ["vis_lt_1_6", "vis_lt_4_8", "lowcloud_90", "snow_03", "fog"]}], "history_stats": []}</script>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=JSON.parse(document.getElementById('seed').textContent);
fetch('latest.json?'+Date.now()).then(r=>r.json()).catch(()=>{if(seed)return seed;throw 0}).then(d=>{
  const g=new Date(d.generated);
  document.getElementById('meta').textContent='Updated '+g.toLocaleString()+' · model: '+
    (d.model==='learned'?'learned from '+d.model_info.cancellations+' cancellations in '+d.model_info.flights+' flights':'starting estimates (no history yet)');
  if(d.demo)document.getElementById('demo').innerHTML='<div class="banner">Demo data — not real conditions.</div>';
  const days=[...new Set(d.flights.map(f=>f.date))].sort();
  const names={};names[days[0]]='Today';if(days[1])names[days[1]]='Tomorrow';
  let html='';
  for(const day of days.reverse()){
    html+='<h2>'+names[day]+' · '+day+'</h2>';
    d.flights.filter(f=>f.date===day).sort((a,b)=>b.risk-a.risk).forEach(f=>{
      const pct=Math.round(f.risk*100);
      html+=`<div class="card ${f.level}"><div class="row"><div><b>${esc(f.flight)}</b> ${esc(f.airport)} → YVR · ${esc(f.dep_local)}<div class="sub">${esc(f.airline)}</div></div>
      <div class="big">${pct}%</div></div>
      <div class="bar" style="color:inherit"><i style="width:${pct}%"></i></div>
      <div>${f.reasons.map(r=>'<span class="tag">'+esc(r)+'</span>').join('')||'<span class="tag">Nothing unusual in the forecast</span>'}</div>
      <div class="sub" style="margin-top:6px">${esc(f.level)} · status: ${esc(f.status)}${f.schedule_source==='static'?' · schedule from config (no flight API)':''}</div></div>`;
    });
  }
  document.getElementById('app').innerHTML=html;
  if(d.history_stats&&d.history_stats.length){
    document.getElementById('hist').innerHTML='<table><tr><th>Condition</th><th>Flights</th><th>Cancelled</th></tr>'+
      d.history_stats.map(s=>`<tr><td>${esc(s.condition)}</td><td>${s.flights}</td><td>${s.cancelled} (${Math.round(s.rate*100)}%)</td></tr>`).join('')+'</table>';
  }
}).catch(e=>document.getElementById('meta').textContent='Could not load latest.json');
</script></body></html>
