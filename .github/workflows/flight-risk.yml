name: Flight risk check
on:
  schedule:
    # Every 30 min: refresh the dashboard. Emails only go out at the times in
    # config.json "alert_times" - edit those (or use Settings on the site), not this.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  # redeploy whenever the code or settings change (the bot's own data commits don't trigger this)
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/history/img/**", "README.md"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: flight-risk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet pillow
      - name: Keep the weather forecast between runs (fetched every ~2 h)
        uses: actions/cache@v4
        with:
          path: .cache/weather
          key: weather-${{ github.run_id }}
          restore-keys: weather-
      - name: Score flights and send alerts
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
        # only a manual "Run workflow" emails right away; schedule/push runs email at alert_times
        run: python run.py ${{ github.event_name != 'workflow_dispatch' && '--scheduled' || '' }}
      - name: Read airport flight boards (about once an hour)
        run: python -m ksalerts.boards || true
      - name: Save alert memory and history
        run: |
          git config user.name "flight-risk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/history/img/ 2>/dev/null || git add data/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update flight risk data"
          git pull --rebase --autostash origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deploy
        uses: actions/deploy-pages@v4
