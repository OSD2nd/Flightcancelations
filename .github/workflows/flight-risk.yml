name: Flight risk check
on:
  schedule:
    - cron: "0 3 * * *"    # ~7pm Pacific: tomorrow's heads-up
    - cron: "30 14 * * *"  # ~6:30am Pacific: catch same-day cancellations
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Score flights and send alerts
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python run.py
      - name: Save results
        run: |
          git config user.name "flight-risk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/latest.json data/
          git diff --staged --quiet || git commit -m "Update flight risk"
          git push
