name: AeroDataBox check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flight-risk
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check the key and airport coverage (free endpoints)
        env:
          # direct account only: this check must not spend the RapidAPI allowance
          AERODATABOX_DIRECT_KEY: ${{ secrets.AERODATABOX_DIRECT_KEY }}
        run: python -m ksalerts.adb_check
      - name: Save
        run: |
          git config user.name "flight-risk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/adb_coverage.json
          git diff --staged --quiet && exit 0
          git commit -m "AeroDataBox coverage check"
          git pull --rebase --autostash -X theirs origin main && git push
